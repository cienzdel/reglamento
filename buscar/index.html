<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador del Reglamento · Consejo de Estudiantes de Ciencias</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="stylesheet" href="../estilo.css">
<style>
  body { background: var(--tarjeta); }
  .buscador { padding: 12px 14px; }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .fila .rotulo { font-size: .85rem; color: var(--suave); margin-right: 2px; }
  .estado { font-size: .85rem; color: var(--suave); margin: 10px 0 4px; min-height: 1.3em; }
  ol.resultados { list-style: none; margin: 0; padding: 0; }
  ol.resultados li { border-top: 1px solid var(--borde); }
  ol.resultados a { display: block; padding: 9px 4px; text-decoration: none; color: var(--texto); }
  ol.resultados a:hover { background: var(--fondo); }
  .cab { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .ref { font-weight: 700; color: var(--azul); }
  .tit { color: var(--suave); font-size: .9rem; }
  .frag { margin: 3px 0 0; font-size: .93rem; }
</style>
</head>
<body>
<main class="buscador">
  <label for="q" class="visualmente-oculto">Buscar en el Reglamento</label>
  <input type="search" id="q" placeholder="Busca una palabra: voto, quorum, vocalías, titulación…" autocomplete="off" enterkeyhint="search">
  <div class="fila" id="ambito" hidden>
    <span class="rotulo">Buscar en:</span>
    <button type="button" class="chip" data-doc="ambos" aria-pressed="true">Los dos</button>
    <button type="button" class="chip" data-doc="nuevo" aria-pressed="false">Propuesta nueva</button>
    <button type="button" class="chip" data-doc="antiguo" aria-pressed="false">Reglamento de 2015</button>
  </div>
  <div class="fila" id="sugerencias">
    <span class="rotulo">Prueba con:</span>
  </div>
  <p class="estado" id="estado" aria-live="polite"></p>
  <ol class="resultados" id="resultados"></ol>
</main>
<script src="buscar.js"></script>
</body>
</html>
